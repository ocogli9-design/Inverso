<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverso</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2a2f;--ink:#e8f6f3;--dim:#7fb3ae;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;background:var(--bg);color:var(--ink);font-family:"Unbounded",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:absolute;left:0;top:0}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
h1{font-size:44px;margin:0 0 12px;font-weight:600}
p{margin:4px 0;max-width:30ch;line-height:1.5;color:var(--dim);font-size:15px}
.go{margin-top:22px;color:#ffd23f;font-size:17px}
#sk{display:flex;gap:14px;margin-top:26px;pointer-events:auto}
.sw{width:52px;height:52px;border:2px solid #2a6a6b;border-radius:14px;background:none;color:#7fb3ae;font:600 13px Unbounded,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:0}
.sw.on{border-color:#ffd23f}.sw.lock{opacity:.5}
.sw i{width:24px;height:24px;display:block}
.s-o{border-radius:50%}.s-d{transform:rotate(45deg) scale(.8)}.s-h{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
#h{font-size:12px;margin-top:12px}
</style></head><body>

SK.forEach(k=>{if(k.img){k.im=new Image();k.im.src=k.img}});
let skin=0;try{skin=+localStorage.getItem('inverso-skin')||0}catch(e){}
if(!SK[skin]||best<SK[skin].need)skin=0;
function renderSk(){
  const el=document.getElementById('sk');el.innerHTML='';
  SK.forEach((k,i)=>{
    const ok=best>=k.need,b=document.createElement('button');
    b.className='sw'+(i===skin?' on':'')+(ok?'':' lock');b.setAttribute('aria-label',ok?k.n:'Bloccata, serve il record '+k.need);
    b.innerHTML=ok?'<i class="s-'+k.s+'" style="background:'+(k.img?'url('+k.img+') center/cover':k.c)+'"></i>':k.need;
    b.onpointerdown=e=>{e.stopPropagation();if(ok){skin=i;try{localStorage.setItem('inverso-skin',i)}catch(x){}renderSk()}};
    el.appendChild(b);
  });
}
renderSk();
let ang=0;
function shape(s,x,y,z){
  ctx.beginPath();
  if(s==='o')ctx.arc(x+z/2,y+z/2,z/2,0,6.2832);
  else if(s==='d'){ctx.moveTo(x+z/2,y);ctx.lineTo(x+z,y+z/2);ctx.lineTo(x+z/2,y+z);ctx.lineTo(x,y+z/2);ctx.closePath()}
  else if(s==='h'){ctx.moveTo(x+z*.25,y);ctx.lineTo(x+z*.75,y);ctx.lineTo(x+z,y+z/2);ctx.lineTo(x+z*.75,y+z);ctx.lineTo(x+z*.25,y+z);ctx.lineTo(x,y+z/2);ctx.closePath()}
  else ctx.rect(x,y,z,z);
  ctx.fill();
}
function flip(){
  if(st==='play'){g=-g;vy=g*200}
  else if(performance.now()-endT>500){reset();st='play';ov.style.display='none'}
}
addEventListener('pointerdown',flip);
addEventListener('keydown',e=>{if(e.code==='Space')flip()});
function die(){
  st='over';endT=performance.now();
  if(score>best){best=score;try{localStorage.setItem('inverso',best)}catch(e){}}
  document.getElementById('t').textContent='Fine';
  document.getElementById('d').textContent='Punteggio '+score+', record '+best+'.';
  renderSk();ov.style.display='flex';
}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.033);last=now;
  if(st==='play'){
    speed=Math.min(speed+6*dt,620);dist+=speed*dt;score=Math.floor(dist/40);
    vy+=g*2600*dt;y+=vy*dt;
    if(y>bot-S){y=bot-S;vy=0}
    if(y<ceil){y=ceil;vy=0}
    next-=dt;
    if(next<=0){const w=34+Math.random()*20;obs.push({x:W+w,w:w,h:50+Math.random()*60,s:Math.random()<.5?1:-1});next=0.75+Math.random()*0.9}
    const px=W*0.22;
    for(const o of obs){
      o.x-=speed*dt;
      const oy=o.s===1?bot-o.h*0.8:ceil;
      if(o.x+o.w*0.75>px+3&&o.x+o.w*0.25<px+S-3&&y+S>oy&&y<oy+o.h*0.8){die();break}
    }
    obs=obs.filter(o=>o.x>-80);
  }
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);ang+=((g===1?0:3.1416)-ang)*0.25;
  ctx.strokeStyle='#2a6a6b';ctx.lineWidth=3;ctx.setLineDash([18,14]);ctx.lineDashOffset=dist%32;
  for(const ly of [ceil,bot]){ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke()}
  ctx.setLineDash([]);
  ctx.fillStyle='#ff5d8f';
  for(const o of obs){
    ctx.beginPath();
    if(o.s===1){ctx.moveTo(o.x,bot);ctx.lineTo(o.x+o.w/2,bot-o.h);ctx.lineTo(o.x+o.w,bot)}
    else{ctx.moveTo(o.x,ceil);ctx.lineTo(o.x+o.w/2,ceil+o.h);ctx.lineTo(o.x+o.w,ceil)}
    ctx.fill();
  }
  ctx.fillStyle=SK[skin].c;
  const px=W*0.22;const k=SK[skin];if(k.img){ctx.save();ctx.translate(px+S/2,y+S/2);ctx.rotate(ang);ctx.beginPath();ctx.arc(0,0,S/2,0,6.2832);ctx.clip();ctx.drawImage(k.im,-S/2,-S/2,S,S);ctx.restore()}else shape(k.s,px,y,S);
  if(!SK[skin].img){ctx.fillStyle='#0b2a2f';ctx.fillRect(px+(S-12),y+(g===1?8:S-14),6,6)}
  ctx.fillStyle='#e8f6f3';ctx.font='600 26px Unbounded, system-ui, sans-serif';ctx.textAlign='left';
  ctx.fillText(score,20,ceil-30);
}
requestAnimationFrame(loop);
</script></body></html>
